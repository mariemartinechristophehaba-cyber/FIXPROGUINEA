{% extends 'base.html' %}
{% block title %}Creer mon compte - FixPro{% endblock %}

{% block content %}
<div class="fx-screen">
  <div class="fx-form-top" style="padding:16px 18px 22px;">
    <a href="{{ url_for('index') }}" style="color:#DCE3F0;text-decoration:none;font-size:12px;">← Retour</a>
    <h3 style="margin-top:12px;">Creer mon compte client</h3>
    <p>Trouvez un technicien verifie en quelques minutes.</p>
  </div>

  <form method="post" action="{{ url_for('client_signup') }}" class="fx-form-body" style="padding-bottom:120px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="fx-fg" style="text-align:center;">
      <div class="fx-photo-box" style="width:90px;height:90px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;">
        📷
      </div>
      <input type="hidden" name="photo_url" />
    </div>

    <div class="fx-fg" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <label class="fx-fl" style="grid-column:1/-1;margin-bottom:0;"><span>Prenom</span><input class="fx-fb" type="text" name="first_name" required placeholder="Mamadou" /></label>
      <label class="fx-fl" style="margin-bottom:0;"><span>Nom</span><input class="fx-fb" type="text" name="last_name" required placeholder="Diallo" /></label>
    </div>

    <div class="fx-fg">
      <div class="fx-fl">Telephone</div>
      <div style="display:flex;gap:6px;">
        <span class="fx-fb" style="flex:0 0 auto;background:var(--paper);color:var(--slate-light);">+224</span>
        <input class="fx-fb" type="tel" name="phone" required placeholder="620 00 00 00" style="flex:1;" />
      </div>
    </div>

    <div class="fx-fg">
      <div class="fx-fl">Quartier</div>
      <input class="fx-fb" type="text" name="city" required value="Conakry" placeholder="Kaloum, Conakry" />
    </div>

    <div class="fx-fg">
      <div class="fx-fl">Email</div>
      <input class="fx-fb" type="email" name="email" required placeholder="vous@email.com" />
    </div>

    <div class="fx-fg">
      <div class="fx-fl">Mot de passe</div>
      <input class="fx-fb" type="password" name="password" required minlength="8" placeholder="8 caracteres minimum" />
    </div>

    <button class="fx-dock-btn primary" type="submit" style="width:100%;margin-top:8px;">Creer mon compte</button>
    <p style="text-align:center;font-size:11.5px;color:var(--slate);margin-top:14px;">Déjà un compte ? <a href="{{ url_for('login') }}" style="color:var(--ink);font-weight:600;">Se connecter</a></p>
  </form>
</div>
{% endblock %}
