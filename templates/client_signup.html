{% extends 'base.html' %}
{% block content %}
<section class="card form-card" style="max-width: 480px; margin: 40px auto;">
  <h2>Créer un compte client</h2>
  <p class="muted">Publiez votre demande et trouvez un artisan en quelques minutes.</p>

  <form method="post" action="{{ url_for('client_signup') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 12px;">
      <div>
        <label>Prénom</label>
        <input type="text" name="first_name" required placeholder="Votre prénom" />
      </div>
      <div>
        <label>Nom</label>
        <input type="text" name="last_name" required placeholder="Votre nom" />
      </div>
    </div>

    <label>Email</label>
    <input type="email" name="email" required placeholder="votre@email.com" />

    <label>Téléphone</label>
    <input type="tel" name="phone" required placeholder="+224 620 00 00 00" />

    <label>Ville</label>
    <input type="text" name="city" required placeholder="Conakry" />

    <label>Mot de passe</label>
    <input type="password" name="password" required minlength="6" placeholder="6 caractères minimum" />

    <button class="btn btn-primary" type="submit" style="width: 100%;">S'inscrire avec email</button>
  </form>

  <div class="divider"><span>ou</span></div>

  <a href="{{ url_for('google_signup') }}" class="btn btn-google" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
    <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continuer avec Google
  </a>

  <p class="small" style="margin-top: 16px; text-align: center;">
    Vous êtes artisan ? <a href="{{ url_for('register', role='artisan') }}">Créer un compte artisan</a>
    · <a href="{{ url_for('login') }}">Connexion</a>
  </p>
</section>

<style>
.divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--muted); }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.btn-google { background: #fff; color: #0a0a0a; border: 1px solid #e5e7eb; }
.btn-google:hover { background: #f3f4f6; }
</style>
{% endblock %}
