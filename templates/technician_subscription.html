<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#155EEF" />
  <title>Abonnement - FixPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F4F7FD; color: #0F172A; -webkit-font-smoothing: antialiased;
      min-height: 100dvh; display: flex; flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }
    .ts-header {
      background: #fff; border-bottom: 1px solid #E6ECF5;
      padding: 14px 16px; padding-top: calc(24px + env(safe-area-inset-top));
      display: flex; align-items: center; gap: 14px;
    }
    .ts-header h1 { font-size: 1.1rem; font-weight: 800; margin: 0; }
    .ts-header a { display: flex; color: #0F172A; }
    .ts-body {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px 24px;
    }
    .ts-body .icon {
      width: 64px; height: 64px; border-radius: 20px; background: #EEF4FF; color: #155EEF;
      display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
    }
    .ts-body h2 { font-size: 1.05rem; font-weight: 800; margin: 0 0 6px; }
    .ts-body p { font-size: 0.9rem; color: #64748B; margin: 0; }
    .ts-body a.btn {
      margin-top: 22px; display: inline-flex; align-items: center; gap: 8px;
      background: #155EEF; color: #fff; padding: 12px 20px; border-radius: 12px;
      font-weight: 700; font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header class="ts-header">
    <a href="{{ url_for('artisan_dashboard') }}" aria-label="Retour">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Abonnement</h1>
  </header>

  <main class="ts-body">
    <span class="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 3 5-7 5 7 4-3-2 11H5L3 8z"/></svg>
    </span>
    <h2>Abonnement FixPro</h2>
    <p>Refonte en cours.</p>
    <a class="btn" href="{{ url_for('artisan_dashboard') }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Retour à l'accueil
    </a>
  </main>
</body>
</html>
