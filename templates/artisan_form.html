{% extends 'base.html' %}
{% block title %}{{ 'Modifier' if artisan else 'Nouveau' }} - Artisan{% endblock %}
{% block content %}
  <div class="card">
    <h2>{{ 'Modifier artisan' if artisan else 'Nouvel artisan' }}</h2>
    <form method="post">
      <div class="form-grid">
        <label>Nom <input name="nom" value="{{ artisan.nom if artisan else '' }}"></label>
        <label>Prénom <input name="prenom" value="{{ artisan.prenom if artisan else '' }}"></label>
        <label>Téléphone <input name="telephone" value="{{ artisan.telephone if artisan else '' }}"></label>
        <label>Métier <input name="metier" value="{{ artisan.metier if artisan else '' }}"></label>
        <label>Latitude <input name="latitude" type="number" step="any" value="{{ artisan.latitude if artisan else '' }}"></label>
        <label>Longitude <input name="longitude" type="number" step="any" value="{{ artisan.longitude if artisan else '' }}"></label>
        <label>Tarif horaire <input name="tarif_horaire" type="number" step="any" value="{{ artisan.tarif_horaire if artisan else '' }}"></label>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn" href="{{ url_for('list_artisans') }}">Annuler</a>
      </div>
    </form>
  </div>
{% endblock %}
