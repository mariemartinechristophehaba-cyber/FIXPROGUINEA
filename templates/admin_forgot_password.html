<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1D4ED8" />
  <meta name="robots" content="noindex" />
  <title>Mot de passe oublié - FixPro Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px; color: #0F172A;
      background: radial-gradient(circle at 15% 10%, rgba(255,255,255,0.14) 0, transparent 30%),
                  linear-gradient(150deg, #2E6BFF 0%, #1D4ED8 50%, #1B3FA8 100%);
    }
    .fp-card {
      width: 100%; max-width: 420px; background: #fff; border-radius: 20px; padding: 32px 28px;
      box-shadow: 0 30px 70px rgba(15,30,61,0.28); text-align: center;
    }
    .fp-ic { width: 56px; height: 56px; border-radius: 16px; background: #EEF4FF; color: #1D4ED8;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .fp-ic svg { width: 26px; height: 26px; }
    .fp-card h1 { font-size: 1.2rem; font-weight: 800; margin: 0 0 8px; }
    .fp-card p { font-size: 0.9rem; color: #475569; line-height: 1.5; margin: 0 0 10px; }
    .fp-card .mail { display: inline-block; margin: 6px 0 20px; font-weight: 700; color: #1D4ED8; }
    .fp-back {
      display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px;
      border-radius: 11px; background: #1D4ED8; color: #fff; font-weight: 700; font-size: 0.9rem;
    }
    .fp-back svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="fp-card">
    <div class="fp-ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
    </div>
    <h1>Mot de passe oublié ?</h1>
    <p>Pour des raisons de sécurité, les accès administrateur sont gérés manuellement.</p>
    <p>Contactez l'administrateur principal de FixPro pour réinitialiser votre mot de passe :</p>
    <a class="mail" href="mailto:{{ support_email }}">{{ support_email }}</a>
    <div>
      <a class="fp-back" href="{{ url_for('admin_login') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Retour à la connexion
      </a>
    </div>
  </div>
</body>
</html>
