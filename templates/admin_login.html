<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Connexion admin - FixPro</title>
  </head>
  <body>
    <!--
      PLACEHOLDER - page de connexion admin videe avant refonte.
      Le formulaire minimal ci-dessous garde la connexion fonctionnelle.
      Ne pas habiller cette page : une nouvelle maquette va la remplacer.
    -->
    <main>
      <h1>FixPro Admin</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <p data-flash="{{ category }}">{{ message }}</p>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <label>Adresse e-mail
          <input type="email" name="email" required autofocus />
        </label>
        <label>Mot de passe
          <input type="password" name="password" required />
        </label>
        <button type="submit">Se connecter</button>
      </form>
    </main>
  </body>
</html>
