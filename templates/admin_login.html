<!--
  PLACEHOLDER - page de connexion admin videe avant refonte complete.
  Formulaire minimal conserve pour garder la connexion fonctionnelle.
  Back-end (route admin_login) inchange : email, password, csrf_token,
  error, security_code_url. Ne pas habiller sans nouvelle maquette.
-->
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Connexion administrateur - FixPro</title>
</head>
<body>
  <main style="max-width:360px;margin:60px auto;padding:0 20px;font-family:system-ui,sans-serif">
    <h1>FixPro Administration</h1>

    {% if error %}
      <p style="color:#c02626">{{ error }}</p>
    {% endif %}

    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label>Adresse e-mail
        <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="username" />
      </label>
      <br /><br />
      <label>Mot de passe
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <br /><br />
      <button type="submit">Se connecter</button>
    </form>

    <p><a href="{{ security_code_url }}">Mot de passe oublie ?</a></p>
  </main>
</body>
</html>
