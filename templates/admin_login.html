<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Connexion administrateur - FixPro</title>
  </head>
  <body>
    <!--
      PLACEHOLDER - page de connexion admin videe avant refonte.
      Formulaire minimal conserve pour garder la connexion fonctionnelle.
      Ne pas habiller : une nouvelle maquette va la remplacer.
      Back-end inchange (route admin_login, verif mot de passe, verrou admin).
    -->
    <main>
      <h1>FixPro Administration</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <p data-flash="{{ category }}">{{ message }}</p>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <label>Adresse e-mail
          <input type="email" name="email" required autofocus autocomplete="username" />
        </label>
        <label>Mot de passe
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <label>
          <input type="checkbox" name="remember" value="1" /> Se souvenir de moi
        </label>
        <button type="submit">Se connecter</button>
      </form>

      <p><a href="{{ url_for('admin_google_login') }}">Se connecter avec Google</a></p>
    </main>
  </body>
</html>
