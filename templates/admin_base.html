<!--
  PLACEHOLDER - coquille admin videe avant refonte complete (login + toutes
  les pages). Blocs conserves : title / head_extra / content / script.
  Back-end, routes et donnees inchanges. Nouvelle maquette a venir.
-->
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <title>{% block title %}Administration - FixPro{% endblock %}</title>
  {% block head_extra %}{% endblock %}
</head>
<body style="font-family:system-ui,sans-serif;margin:0">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #e2e8f0">
    <nav style="display:flex;gap:16px;flex-wrap:wrap">
      <a href="{{ url_for('admin_dashboard') }}">Tableau de bord</a>
      <a href="{{ url_for('admin_users') }}">Utilisateurs</a>
      <a href="{{ url_for('admin_technicians') }}">Techniciens</a>
      <a href="{{ url_for('admin_payments') }}">Paiements</a>
      <a href="{{ url_for('admin_notifications') }}">Notifications</a>
    </nav>
    <div>
      <span>{{ admin_user.full_name if admin_user else 'Administrateur' }}</span>
      &middot; <a href="{{ url_for('admin_logout') }}">Deconnexion</a>
    </div>
  </header>
  <main style="padding:24px 20px">
    {% block content %}{% endblock %}
  </main>
  {% block script %}{% endblock %}
</body>
</html>
