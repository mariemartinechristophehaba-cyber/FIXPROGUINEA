{% extends 'base.html' %}
{% block content %}
<section class="card" style="max-width: 900px; margin: 0 auto; padding: 32px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px;">
    <h2 style="margin: 0;">Tableau de bord</h2>
    <a href="{{ url_for('admin_logout') }}" class="btn btn-outline" style="padding: 10px 18px;">Deconnexion admin</a>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px;">
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center;">
      <div style="font-size: 2rem; font-weight: 800; color: var(--text);">{{ stats.clients }}</div>
      <div class="small muted" style="margin-top: 6px;">Clients inscrits</div>
    </div>
    <div style="background: rgba(245,166,35,0.1); border: 1px solid rgba(245,166,35,0.25); border-radius: 16px; padding: 24px; text-align: center;">
      <div style="font-size: 2rem; font-weight: 800; color: var(--accent-orange);">{{ stats.pending_artisans }}</div>
      <div class="small muted" style="margin-top: 6px;">Artisans en attente</div>
    </div>
    <div style="background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); border-radius: 16px; padding: 24px; text-align: center;">
      <div style="font-size: 2rem; font-weight: 800; color: var(--accent-green);">{{ stats.verified_artisans }}</div>
      <div class="small muted" style="margin-top: 6px;">Artisans valides</div>
    </div>
    <div style="background: rgba(37,99,235,0.1); border: 1px solid rgba(37,99,235,0.25); border-radius: 16px; padding: 24px; text-align: center;">
      <div style="font-size: 2rem; font-weight: 800; color: var(--accent-blue);">{{ stats.requests }}</div>
      <div class="small muted" style="margin-top: 6px;">Demandes</div>
    </div>
  </div>

  <div style="margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap;">
    <a href="{{ url_for('admin_artisans') }}" class="btn btn-primary">Valider les artisans</a>
    <a href="{{ url_for('index') }}" class="btn btn-outline">Retour a l'accueil</a>
  </div>
</section>
{% endblock %}
