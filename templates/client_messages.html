<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#155EEF" />
  {% include '_pwa_head.html' %}
  <title>Messages - FixPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F4F7FD; color: #0F172A; -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }

    .cm-header {
      background: #fff; border-bottom: 1px solid #E6ECF5;
      padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top));
      display: flex; align-items: center; gap: 14px;
    }
    .cm-header h1 { font-size: 1.2rem; font-weight: 800; margin: 0; }
    .cm-header a { display: flex; color: #0F172A; }

    .cm-body {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px 24px 120px;
    }
    .cm-body .icon {
      width: 64px; height: 64px; border-radius: 20px; background: #EEF4FF; color: #155EEF;
      display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
    }
    .cm-body h2 { font-size: 1.05rem; font-weight: 800; margin: 0 0 6px; }
    .cm-body p { font-size: 0.9rem; color: #64748B; margin: 0; }

    .cm-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
      border-top: 1px solid #E6ECF5; display: flex; justify-content: space-around; align-items: flex-end;
      padding: 8px 0 14px; z-index: 90;
    }
    .cm-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: #64748B; font-size: 0.65rem; font-weight: 600; flex: 1;
    }
    .cm-nav a svg { width: 22px; height: 22px; }
    .cm-nav a.active { color: #155EEF; }
    .cm-nav a.cm-fab {
      position: relative; top: -16px; flex: 0 0 54px; width: 54px; height: 54px; min-width: 54px;
      background: #155EEF; color: #fff; border-radius: 50%;
      justify-content: center; align-self: flex-start;
      box-shadow: 0 10px 22px rgba(21,94,239,0.34);
    }
    .cm-nav a.cm-fab svg { width: 24px; height: 24px; }
    .cm-nav a.cm-fab span {
      position: absolute; bottom: -18px; width: 92px; left: 50%; transform: translateX(-50%);
      text-align: center; color: #64748B; font-size: 0.65rem;
    }
  </style>
</head>
<body>
  <header class="cm-header">
    <a href="{{ url_for('index') }}" aria-label="Retour">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Messages</h1>
  </header>

  <main class="cm-body">
    <span class="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>
    </span>
    <h2>Messages</h2>
    <p>Refonte en cours.</p>
  </main>

  <nav class="cm-nav">
    <a href="{{ url_for('index') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Accueil
    </a>
    <a href="{{ url_for('artisans_page') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      Recherche
    </a>
    <a href="{{ url_for('requests_list') if user else url_for('login') }}" class="cm-fab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
      <span>Réservations</span>
    </a>
    <a href="{{ url_for('client_messages') }}" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>
      Messages
    </a>
    <a href="{% if user %}{{ url_for('profile') }}{% else %}{{ url_for('login') }}{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profil
    </a>
  </nav>
</body>
</html>
