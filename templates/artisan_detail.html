{% extends 'base.html' %}
{% block title %}{{ artisan.full_name if artisan else 'Professionnel' }} - FixPro{% endblock %}
{% block header %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<style>
  .ad-placeholder {
    min-height: 60vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 24px; color: #64748B;
  }
  .ad-placeholder .icon {
    width: 64px; height: 64px; border-radius: 20px; background: #EEF4FF; color: #155EEF;
    display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
  }
  .ad-placeholder h1 { font-size: 1.15rem; color: #0F172A; margin: 0 0 6px; }
  .ad-placeholder p { margin: 0; font-size: 0.9rem; }
  .ad-placeholder a {
    margin-top: 20px; display: inline-flex; align-items: center; gap: 8px;
    background: #155EEF; color: #fff; text-decoration: none;
    padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 0.9rem;
  }
</style>

<section class="ad-placeholder">
  <span class="icon">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
  </span>
  <h1>Profil du professionnel</h1>
  <p>Refonte en cours.</p>
  <a href="{{ url_for('artisans_page') }}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Retour à la recherche
  </a>
</section>
{% endblock %}
