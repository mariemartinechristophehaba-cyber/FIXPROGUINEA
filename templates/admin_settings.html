{% extends 'admin_base.html' %}
{% block title %}Parametres - FixPro Admin{% endblock %}
{% block admin_title %}Parametres systeme{% endblock %}

{% block admin_content %}
<div class="admin-card">
  <h3>Taux de commission FixPro</h3>
  <form method="post" class="admin-inline-form" style="display: flex; gap: 12px; align-items: flex-end; margin-top: 18px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <label class="field" style="flex: 1;">
      <span>Taux de commission (0.10 = 10%)</span>
      <input type="number" name="commission_rate" step="0.01" min="0" max="1" value="{{ commission_rate }}" class="form-input" required />
    </label>
    <button type="submit" class="btn btn-primary">Mettre a jour</button>
  </form>
  <p class="small muted" style="margin-top: 12px;">Applique aux nouveaux paiements calcules automatiquement.</p>
</div>
{% endblock %}
