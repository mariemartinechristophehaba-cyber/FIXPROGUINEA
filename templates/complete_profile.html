{% extends 'base.html' %}
{% block title %}Completer mon profil - FixPro{% endblock %}
{% block main_class %}page page-narrow{% endblock %}

{% block content %}
<section class="page-head">
  <h1>Presque termine</h1>
  <p>Vous etes connecte avec {{ email }}. Il ne reste que deux informations.</p>
</section>

<div class="card card-pad-lg">
  <form method="post" action="{{ url_for('complete_profile') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <label class="field">
      <span>Nom complet</span>
      <input type="text" value="{{ full_name }}" disabled />
    </label>

    <label class="field">
      <span>Telephone</span>
      <div class="input-group">
        <span class="prefix">+224</span>
        <input type="tel" name="phone" required placeholder="620 00 00 00" />
      </div>
    </label>

    <label class="field">
      <span>Ville</span>
      <input type="text" name="city" required value="Conakry" placeholder="Conakry" />
    </label>

    <button class="btn btn-primary btn-block btn-lg" type="submit">Finaliser mon inscription</button>
  </form>
</div>
{% endblock %}
