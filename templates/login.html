{% extends 'base.html' %}
{% block content %}
<section class="card form-card">
  <h2>Connexion</h2>
  <p class="muted">Saisissez votre téléphone ou votre email.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <label>Téléphone ou email</label>
    <input type="text" name="identifier" required placeholder="+224 620 00 00 00 ou email@exemple.com" />

    <label>Mot de passe</label>
    <input type="password" name="password" required minlength="6" placeholder="6 caractères minimum" />

    <button class="btn btn-primary" type="submit">Se connecter</button>
  </form>

  <p class="small" style="margin-top:16px; text-align:center;">
    Pas de compte ?
    <a href="{{ url_for('register', role='client') }}">Créer un compte client</a>
    ·
    <a href="{{ url_for('register', role='artisan') }}">Créer un compte artisan</a>
  </p>
</section>
{% endblock %}
