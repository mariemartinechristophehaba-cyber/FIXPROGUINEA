<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#155EEF" />
  {% include '_pwa_head.html' %}
  <title>Activer mon compte - FixPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: 'Inter', sans-serif; background: #F1F5F9; color: #0F172A; -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .a-wrap { width: 100%; max-width: 420px; }
    .a-card { background: #fff; border-radius: 24px; padding: 32px; box-shadow: 0 24px 80px rgba(0,0,0,.1); }
    .a-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .a-logo-mark { width: 38px; height: 38px; border-radius: 10px; background: #155EEF; display: grid; place-items: center; color: #fff; }
    .a-logo-mark svg { width: 22px; height: 22px; }
    .a-logo-text { font-size: 20px; font-weight: 800; }
    .a-title { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
    .a-subtitle { font-size: 14px; color: #64748B; margin: 0 0 24px; }
    .a-field { margin-bottom: 16px; }
    .a-field label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    .a-field input { width: 100%; padding: 14px; border: 1px solid #E2E8F0; border-radius: 14px; font-size: 15px; outline: none; }
    .a-field input:focus { border-color: #155EEF; }
    .a-btn { width: 100%; padding: 15px; background: #155EEF; color: #fff; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .a-user { display: flex; align-items: center; gap: 12px; padding: 14px; background: #F1F5F9; border-radius: 16px; margin-bottom: 24px; }
    .a-avatar { width: 44px; height: 44px; border-radius: 50%; background: #EEF4FF; color: #155EEF; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
    .a-name { font-weight: 600; }
    .a-role { font-size: 13px; color: #64748B; }
  </style>
</head>
<body>
  <div class="a-wrap">
    <div class="a-card">
      <div class="a-logo">
        <div class="a-logo-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </div>
        <span class="a-logo-text">FixPro</span>
      </div>
      <h1 class="a-title">Activer votre compte</h1>
      <p class="a-subtitle">Votre compte a ete valide par l'administration. Definissez votre mot de passe pour commencer.</p>

      <div class="a-user">
        <div class="a-avatar">{{ (user.full_name or 'U')[0]|upper }}</div>
        <div>
          <div class="a-name">{{ user.full_name }}</div>
          <div class="a-role">{{ user.profession or 'Technicien' }}</div>
        </div>
      </div>

      <form method="post" action="{{ url_for('technician_activate') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="hidden" name="token" value="{{ token }}" />
        <div class="a-field">
          <label for="password">Nouveau mot de passe</label>
          <input id="password" type="password" name="password" required minlength="8" placeholder="Au moins 8 caracteres" />
        </div>
        <div class="a-field">
          <label for="confirm_password">Confirmer le mot de passe</label>
          <input id="confirm_password" type="password" name="confirm_password" required placeholder="Saisissez a nouveau" />
        </div>
        <button class="a-btn" type="submit">Activer mon compte</button>
      </form>
    </div>
  </div>
</body>
</html>
