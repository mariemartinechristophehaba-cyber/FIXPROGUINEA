<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  {% include '_pwa_head.html' %}
  <title>Contacter {{ artisan.full_name }} - FixPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F4F7FD; color: #0F172A; -webkit-font-smoothing: antialiased;
      min-height: 100dvh; display: flex; flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }
    .ct-header {
      background: #fff; border-bottom: 1px solid #E6ECF5;
      padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top));
      display: flex; align-items: center; gap: 14px;
    }
    .ct-header h1 { font-size: 1.1rem; font-weight: 800; margin: 0; }
    .ct-header a { display: flex; color: #0F172A; }
    .ct-body {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px 24px;
    }
    .ct-body .icon {
      width: 64px; height: 64px; border-radius: 20px; background: #EEF4FF; color: #155EEF;
      display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
    }
    .ct-body h2 { font-size: 1.05rem; font-weight: 800; margin: 0 0 6px; }
    .ct-body p { font-size: 0.9rem; color: #64748B; margin: 0; }
    .ct-body a.btn {
      margin-top: 22px; display: inline-flex; align-items: center; gap: 8px;
      background: #155EEF; color: #fff; padding: 12px 20px; border-radius: 12px;
      font-weight: 700; font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header class="ct-header">
    <a href="{{ back_url or url_for('artisan_detail', artisan_id=artisan.id) }}" aria-label="Retour">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Contacter {{ artisan.full_name }}</h1>
  </header>

  <main class="ct-body">
    <span class="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </span>
    <h2>Contacter un professionnel</h2>
    <p>Refonte en cours.</p>
    <a class="btn" href="{{ back_url or url_for('artisan_detail', artisan_id=artisan.id) }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Retour au profil
    </a>
  </main>
</body>
</html>
