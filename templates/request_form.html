{% extends 'base.html' %}
{% block title %}Nouvelle demande - FixPro{% endblock %}
{% block main_class %}page page-mid{% endblock %}

{% block content %}
<section class="page-head">
  <h1>Nouvelle demande</h1>
  <p>Decrivez votre besoin. Un technicien verifie vous repondra avec un devis.</p>
</section>

<div class="card card-pad-lg">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <label class="field">
      <span>Titre de la demande</span>
      <input type="text" name="title" required placeholder="Fuite sous l'evier de la cuisine" />
    </label>

    <label class="field">
      <span>Description</span>
      <textarea name="description" required placeholder="Expliquez le probleme, depuis quand il dure, et ce que vous avez deja essaye."></textarea>
    </label>

    <label class="field">
      <span>Categorie</span>
      <select name="category" id="categorySelect" required>
        <option value="" disabled selected>Selectionnez une categorie</option>
        {% for category in categories %}
        <option value="{{ category['name'] }}" data-price="{{ category['diagnostic_price'] }}">{{ category['name'] }}</option>
        {% endfor %}
      </select>
      <span class="hint" id="diagnosticHint">Le prix du diagnostic s'affichera ici.</span>
    </label>

    <label class="field">
      <span>Adresse ou zone</span>
      <input type="text" name="address" placeholder="Kaloum, Conakry" />
    </label>

    <div class="field-2">
      <label class="field">
        <span>Budget estime (GNF)</span>
        <input type="number" name="budget" value="0" min="0" step="10000" />
      </label>
      <label class="field">
        <span>Photo du probleme</span>
        <input type="text" name="photo_url" placeholder="Lien de la photo" />
      </label>
    </div>

    <button class="btn btn-primary btn-block btn-lg" type="submit">Publier ma demande</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  const categorySelect = document.getElementById('categorySelect');
  const diagnosticHint = document.getElementById('diagnosticHint');
  categorySelect.addEventListener('change', () => {
    const option = categorySelect.selectedOptions[0];
    const price = Number(option.dataset.price || 0);
    diagnosticHint.textContent = price
      ? 'Prix du diagnostic : ' + price.toLocaleString('fr-FR') + ' GNF'
      : 'Le prix du diagnostic s\'affichera ici.';
  });
</script>
{% endblock %}
