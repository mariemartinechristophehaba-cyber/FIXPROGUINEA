# Configuration Render pour FixPro avec Supabase
services:
  - type: web
    name: fixpro-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: SECRET_KEY
        generateValue: true
      - key: FIXPRO_DB_ENGINE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://fixpro-app.onrender.com
      - key: FIXPRO_DEFAULT_COMMISSION
        value: 10
      - key: FIXPRO_COMMISSION_RATE
        value: 0.10
      - key: LOG_LEVEL
        value: INFO